          modal.classList.remove('active');

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (typeof closeLegalModal === 'function') closeLegalModal();
        }
      });

      function init() {
        // --- Utility ---
        const debounce = (func, wait) => {
          let timeout;
          return (...args) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => func(...args), wait);
          };
        };

        // --- Fix Mobile Menu Link Clicks ---
        document.addEventListener('click', (e) => {
          const anchor = e.target.closest('a[href^="#"]');
          if (anchor) {
            const isMobileMenu = anchor.closest('[role="dialog"]') || anchor.closest('[class*="fixed inset-0"]');
            if (isMobileMenu) {
              const targetId = anchor.getAttribute('href');
              const targetEl = document.querySelector(targetId);
              if (targetEl) {
                setTimeout(() => {
                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
              }
            }
          }
        }, true);

        // --- 1. Animation Observer ---
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.remove('reveal-pending');
              entry.target.classList.add('reveal-active');
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });

        const observeElements = debounce(() => {
            const targets = document.querySelectorAll('.industrial-card:not(.reveal), .gallery-card:not(.reveal), #servicios .group:not(.reveal), #resenas .grid > div:not(.reveal), h2:not(.reveal)');
            targets.forEach(target => {
              target.classList.add('reveal', 'reveal-pending');
              revealObserver.observe(target);
            });
        }, 100);

        // --- Helper for Caching Videos ---
        const preloadVideo = async (url) => {
          try {
            const cache = await caches.open('blessed-video-cache');
            let response = await cache.match(url);
            if (!response) {
              await cache.add(url);
              response = await cache.match(url);
            }
            if (response) {
              const blob = await response.blob();
              return URL.createObjectURL(blob);
            }
          } catch (e) {
            console.warn("Cache API failed, falling back to direct URL", e);
          }
          return url;
        };

        // --- 2. Gallery Video Injection & Interaction ---
        const handleGallery = debounce(() => {
          const cards = document.querySelectorAll('.gallery-card');
          if (cards.length >= 6) {
            const middleIndices = [3, 4, 5];
            const videoSources = [
              './images/video1.mp4', 
              './images/video2.mp4', 
              './images/video3.mp4'
            ];

            let injectedCount = 0;
            middleIndices.forEach((index, i) => {
              const card = cards[index];
              const container = card.querySelector('.img-container');
              
              if (container && !container.querySelector('video')) {
                const img = container.querySelector('img');
                const video = document.createElement('video');
                
                if (img) {
                  video.poster = img.src;
                  img.style.display = 'none';
                }

                const rawSrc = videoSources[i];
                video.dataset.src = rawSrc;
                video.src = rawSrc;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.preload = 'metadata';
                video.setAttribute('muted', '');
                video.setAttribute('playsinline', '');
                video.setAttribute('preload', 'metadata');
                
                video.className = 'w-full h-full object-cover transition-transform duration-700';
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';

                const playVideo = () => {
                    video.play().catch(e => {});
                    video.style.transform = 'scale(1.03)';
                };

                const pauseVideo = () => {
                    video.style.transform = 'scale(1.0)';
                };

                card.addEventListener('mouseenter', playVideo);
                card.addEventListener('mouseleave', pauseVideo);
                
                card.addEventListener('click', (e) => {
                    if (video.paused) {
                        video.play().catch(e => {});
                    } else {
                        video.pause();
                    }
                });

                container.appendChild(video);
                card.classList.add('video-card', 'video-injected');
                injectedCount++;

                const lazyVideoObserver = new IntersectionObserver((entries) => {
                  entries.forEach(entry => {
                    if (entry.isIntersecting) {
                      card.classList.add('visible-on-screen');
                      if (video.src) video.play().catch(e => {});
                    } else {
                      card.classList.remove('visible-on-screen');
                      video.pause();
                    }
                  });
                }, { threshold: 0.15 });
                lazyVideoObserver.observe(card);
              }
            });

            // Lazy loading / precarga diferida acelerada al acercarse a la sección #galeria
            const galeriaEl = document.querySelector('#galeria');
            if (galeriaEl && !galeriaEl.dataset.lazyObserved) {
              galeriaEl.dataset.lazyObserved = 'true';
              const galeriaObserver = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                  if (entry.isIntersecting) {
                    obs.disconnect();
                    const vCards = galeriaEl.querySelectorAll('video');
                    vCards.forEach(v => {
                      const vSrc = v.dataset.src || v.src;
                      if (vSrc && !vSrc.startsWith('blob:')) {
                        preloadVideo(vSrc).then(blobUrl => {
                          if (blobUrl && v.src !== blobUrl) {
                            const wasPlaying = !v.paused;
                            v.src = blobUrl;
                            if (wasPlaying || v.closest('.visible-on-screen')) {
                              v.play().catch(e => {});
                            }
                          }
                        });
                      }
                    });
                  }
                });
              }, { rootMargin: '200px 0px' });
              galeriaObserver.observe(galeriaEl);
            }

            if (injectedCount > 0) window.dispatchEvent(new Event('resize'));

            if (cards.length >= 8) {
              const card8 = cards[7];
              const img8 = card8.querySelector('img');
              if (img8 && !img8.src.includes('fotonuew.png')) {
                img8.src = './images/fotonuew.png';
              }
            }
          }
        }, 150);

        // --- 3. Production Fixes & CSS Polish ---
        const optimizeProduction = debounce(() => {
          document.querySelectorAll('button, a, p, span, div').forEach(el => {
              if (el.children.length === 0) {
                  const text = el.textContent.trim();
                  if (text.includes('WHATSAPP CON GUSTAVO')) el.textContent = 'RESERVAR CON WHATSAPP';
                  if (text.includes('WhatsApp con servicio')) el.textContent = 'RESERVAR CON WHATSAPP';
                  if (text.includes('631 935 439')) el.textContent = 'PALMA DE MALLORCA';
                  
                  if (text === 'By Gustavo' || text === 'Est. 2024 · Palma' || text === 'PREMIUM CUTS.') {
                      el.style.display = 'none';
                      el.style.visibility = 'hidden';
                      const parent = el.closest('div, a, button');
                      if (parent && parent.tagName !== 'NAV' && parent.children.length <= 2) {
                          parent.style.display = 'none';
                      }
                  }
              }
          });

          document.querySelectorAll('img:not(.lazy-applied)').forEach(img => {
            if (!img.getAttribute('loading')) img.setAttribute('loading', 'lazy');
            if (!img.alt) img.alt = "Blessed Barber Studio — Barbería Premium";
            img.classList.add('transition-opacity', 'duration-500', 'lazy-applied');
          });

          const mapSection = document.querySelector('#mapa');
          if (mapSection && !mapSection.querySelector('a[href*="maps.google.com"]')) {
            const textContainer = mapSection.querySelector('.container') || mapSection.firstElementChild;
            const gmapsLink = document.createElement('a');
            gmapsLink.href = 'https://maps.google.com/?q=Blessed+Barber+Studio+Palma';
            gmapsLink.target = '_blank';
            gmapsLink.rel = 'noopener noreferrer';
            gmapsLink.className = 'mt-4 inline-flex items-center gap-2 px-4 py-2 bg-card hover:bg-muted border border-border rounded-lg text-sm transition-colors text-primary font-medium';
            gmapsLink.textContent = 'Abrir en Google Maps ↗';
            if (textContainer) {
              textContainer.appendChild(gmapsLink);
            } else {
              mapSection.appendChild(gmapsLink);
            }
          }

          const mapContainer = document.querySelector('#mapa > div:last-child');
          if (mapContainer && !mapContainer.classList.contains('map-observed')) {
            mapContainer.classList.add('map-observed');
            mapContainer.addEventListener('click', () => mapContainer.classList.add('map-active'));
            const mapObserver = new IntersectionObserver((entries) => {
              if (!entries[0].isIntersecting) mapContainer.classList.remove('map-active');
            }, { threshold: 0 });
            mapObserver.observe(mapContainer);
          }

          const footer = document.querySelector('footer');
          const gridContainer = footer ? footer.querySelector('.container') : null;
          const copyrightP = Array.from(document.querySelectorAll('p')).find(p => p.textContent.includes('Blessed Barber Studio. Todos los derechos reservados.'));
          
          if (footer && gridContainer && copyrightP) {
            let bottomContainer = document.getElementById('footer-bottom-row');
            if (!bottomContainer) {
              bottomContainer = document.createElement('div');
              bottomContainer.id = 'footer-bottom-row';
              bottomContainer.className = 'w-full mt-10 pt-8 border-t border-white/5 flex flex-col items-center gap-2 text-center col-span-full md:col-span-3';
              gridContainer.appendChild(bottomContainer);
            }
            
            if (copyrightP.parentNode !== bottomContainer) {
              bottomContainer.appendChild(copyrightP);
            }
            
            let creditP = document.getElementById('mynext-credit');
            if (!creditP) {
              creditP = document.createElement('p');
              creditP.id = 'mynext-credit';
              creditP.className = 'mynext-credit';
              creditP.innerHTML = 'Made by <a href="https://mynextbymusa.pages.dev/" target="_blank" rel="noopener noreferrer" class="mynext-link">MYNEXT</a>';
              const oldCredit = document.getElementById('musa-credit');
              if (oldCredit) oldCredit.remove();
            }
            
            if (creditP.parentNode !== bottomContainer) {
              bottomContainer.appendChild(creditP);
            }
          }

          // Live Business Status Badge in Footer (uipro-max)
          if (footer) {
            const centerCol = footer.querySelector('.container > div:nth-child(2)');
            if (centerCol && !document.getElementById('footer-live-status')) {
              const now = new Date();
              const formatter = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: 'numeric', minute: 'numeric', hour12: false });
              const parts = formatter.formatToParts(now);
              const hour = parseInt(parts.find(p => p.type === 'hour')?.value || '12', 10);
              const day = now.getDay();
              const isOpen = (day >= 1 && day <= 6) && (hour >= 10 && hour < 20);

              const statusDiv = document.createElement('div');
              statusDiv.id = 'footer-live-status';
              statusDiv.className = `footer-live-badge ${isOpen ? 'open' : 'closed'}`;
              statusDiv.innerHTML = isOpen
                ? '<span class="footer-pulse-dot"></span> Abierto hoy · 10:00 - 20:00'
                : '<span class="footer-closed-dot"></span> Cerrado ahora · Abre a las 10:00';

              const locationLink = document.createElement('a');
              locationLink.id = 'footer-location-btn';
              locationLink.href = 'https://maps.google.com/?q=Blessed+Barber+Studio+Palma';
              locationLink.target = '_blank';
              locationLink.rel = 'noopener noreferrer';
              locationLink.className = 'footer-location-card';
              locationLink.innerHTML = '<span>📍</span> Carrer Miquel Marquès, 12, Palma';

              const socialsContainer = centerCol.querySelector('.flex.gap-4');
              if (socialsContainer) {
                centerCol.insertBefore(statusDiv, socialsContainer);
                centerCol.insertBefore(locationLink, socialsContainer);
              } else {
                centerCol.appendChild(statusDiv);
                centerCol.appendChild(locationLink);
              }
            }
          }

          document.querySelectorAll('a, button, h2, h3, span, p, div').forEach(el => {
            const txt = el.textContent.trim();
            if (txt === 'Filosofía' || txt === 'FILOSOFÍA' || txt === 'Nuestra Esencia' || txt === 'NUESTRA ESENCIA') {
              el.textContent = 'Sobre nosotros';
              el.classList.add('font-serif');
            }
            if (el.children.length === 0) {
              if (txt.includes('Reservar en Booksy') || txt.includes('reservar online en Booksy') || txt === 'RESERVAR') {
                el.textContent = 'RESERVAR ONLINE';
              } else if (txt.includes('Reserva online en Booksy.')) {
                el.textContent = 'Reserva tu cita online en tiempo real.';
              } else if (txt.includes('Reserva online en segundos a través de Booksy') || txt.includes('o si lo prefieres por WhatsApp')) {
                el.textContent = 'Reserva tu cita online en segundos en Setmore con calendario en tiempo real y confirmación inmediata.';
              } else if (txt.includes('en Booksy') && !txt.includes('reseña')) {
                el.textContent = txt.replace(/en Booksy/gi, 'Online');
              }
            }
            if (el.tagName === 'A' && el.href && (el.href.includes('booksy.com') || el.href.includes('setmore.com'))) {
              el.href = 'https://blessedbarberpalma.setmore.com';
              el.setAttribute('target', '_blank');
              el.setAttribute('rel', 'noopener noreferrer');
            }
          });

          // Ocultar botones de WhatsApp en la versión de reservas con Setmore
          document.querySelectorAll('button[aria-label="Reservar por WhatsApp"], button.bg-\\[\\#25D366\\], [class*="bg-[#25D366]"]').forEach(b => {
            b.style.display = 'none';
          });
        }, 150);

        // Setup interactive Gallery Category Filter, Navigation Arrows & Elongated Track (uipro-max)
        const setupGalleryInteractions = () => {
          const galeriaSection = document.querySelector('#galeria');
          if (!galeriaSection) return;
          const grid = galeriaSection.querySelector('.grid');
          if (!grid) return;

          if (!document.getElementById('gallery-filter-bar')) {
            const filterBar = document.createElement('div');
            filterBar.id = 'gallery-filter-bar';
            filterBar.className = 'flex items-center justify-between gap-3 mb-6 px-2 flex-wrap z-10 relative max-w-[95%] mx-auto';
            filterBar.innerHTML = `
              <div class="flex items-center gap-2 flex-wrap">
                <button type="button" data-filter="all" class="gallery-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all">Todos</button>
                <button type="button" data-filter="video" class="gallery-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all">Vídeos 🎬</button>
                <button type="button" data-filter="photo" class="gallery-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all">Cortes ✂️</button>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" id="gallery-prev" class="slider-nav-btn" aria-label="Anterior">‹</button>
                <button type="button" id="gallery-next" class="slider-nav-btn" aria-label="Siguiente">›</button>
              </div>
            `;

            grid.parentNode.insertBefore(filterBar, grid);

            const prevBtn = filterBar.querySelector('#gallery-prev');
            const nextBtn = filterBar.querySelector('#gallery-next');
            if (prevBtn) prevBtn.addEventListener('click', () => grid.scrollBy({ left: -360, behavior: 'smooth' }));
            if (nextBtn) nextBtn.addEventListener('click', () => grid.scrollBy({ left: 360, behavior: 'smooth' }));

            filterBar.querySelectorAll('.gallery-filter-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                filterBar.querySelectorAll('.gallery-filter-btn').forEach(b => b.classList.remove('active-filter'));
                btn.classList.add('active-filter');
                const filter = btn.dataset.filter;
                Array.from(grid.children).forEach(card => {
                  const isVideo = card.querySelector('video') !== null;
                  if (filter === 'all') {
                    card.style.display = '';
                  } else if (filter === 'video') {
                    card.style.display = isVideo ? '' : 'none';
                  } else if (filter === 'photo') {
                    card.style.display = !isVideo ? '' : 'none';
                  }
                });
                grid.scrollTo({ left: 0, behavior: 'smooth' });
              });
            });
          }
        };

        // Setup Reviews Navigation Arrows & Panoramic Track (uipro-max)
        const setupReviewsInteractions = () => {
          const resenasSection = document.querySelector('#resenas');
          if (!resenasSection) return;
          const grid = resenasSection.querySelector('.grid');
          if (!grid) return;

          if (!document.getElementById('reviews-nav-bar')) {
            const navBar = document.createElement('div');
            navBar.id = 'reviews-nav-bar';
            navBar.className = 'flex items-center justify-between gap-3 mb-6 px-2 z-10 relative max-w-[95%] mx-auto';
            navBar.innerHTML = `
              <div class="text-xs uppercase tracking-widest text-[#D4AF37] font-semibold flex items-center gap-2">
                <span>★</span> Opiniones Verificadas de Clientes
              </div>
              <div class="flex items-center gap-2">
                <button type="button" id="reviews-prev" class="slider-nav-btn" aria-label="Anterior">‹</button>
                <button type="button" id="reviews-next" class="slider-nav-btn" aria-label="Siguiente">›</button>
              </div>
            `;

            grid.parentNode.insertBefore(navBar, grid);

            const prevBtn = navBar.querySelector('#reviews-prev');
            const nextBtn = navBar.querySelector('#reviews-next');
            if (prevBtn) prevBtn.addEventListener('click', () => grid.scrollBy({ left: -380, behavior: 'smooth' }));
            if (nextBtn) nextBtn.addEventListener('click', () => grid.scrollBy({ left: 380, behavior: 'smooth' }));
          }
        };

        // Combined Observer for Performance
        const runAll = () => {
          observeElements();
          handleGallery();
          optimizeProduction();
          setupGalleryInteractions();
          setupReviewsInteractions();
        };

        runAll();
        const globalObserver = new MutationObserver(runAll);
        globalObserver.observe(document.body, { childList: true, subtree: true });
      }

      // Safe Init Runner
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>

    <!-- Static Premium Legal Modal Root -->
    <div id="mynext-legal-modal-root" class="mynext-legal-modal" onclick="if(event.target === this) closeLegalModal()">
      <div class="mynext-legal-content">
        <button class="mynext-legal-close" onclick="closeLegalModal()">✕</button>
        <h3 class="mynext-legal-title" id="mynext-legal-title-text"></h3>
        <div class="mynext-legal-body" id="mynext-legal-body-text"></div>
      </div>
    </div>
  </body>
</html>
